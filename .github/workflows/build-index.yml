name: Build decompilation index

# Cadence: the index is generated FROM research/ (generate_index.py walks it and rewrites
# INDEX.md, INDEX.json and the research/ tables it owns), so a push that changes nothing
# under research/ cannot change the output. It used to run on every push to main, which
# spent a run on each docs- or code-only commit for a result identical to the last one.
# `paths` keeps it to the inputs it actually reads, and workflow_dispatch stays available
# for a deliberate refresh. The workflow file itself is deliberately NOT in `paths`: a
# cadence edit should not buy a run to prove itself, and this job only rewrites files.
on:
  push:
    branches: [ main ]
    paths:
      - 'research/**'
      - '.github/scripts/generate_index.py'
  pull_request:
    branches: [ main ]
    paths:
      - 'research/**'
      - '.github/scripts/generate_index.py'
  workflow_dispatch:

# Two pushes in quick succession should not queue two identical generations: the newer
# push supersedes the older one's output.
concurrency:
  group: build-index-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # No pip step: generate_index.py imports only the standard library (json, os, re,
      # sys, pathlib, collections). The jinja2 install was unused (audit finding J).
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate index files
        run: |
          python3 .github/scripts/generate_index.py

      - name: Commit back if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add INDEX.md INDEX.json research/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: auto-update index [skip ci]"
            git push
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: decompilation-index
          path: |
            INDEX.md
            INDEX.json
          retention-days: 30
