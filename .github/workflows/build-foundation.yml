name: Build foundation (Linux / Windows / Web)

# The point of the foundation is that one source tree builds for every target, so
# the matrix below covers all three rather than the one the runner happens to be.

# Cadence (issue #28):
#   push to main touching remake/foundation/**        -> linux
#   push to main that changes
#   remake/foundation/VERSION                         -> linux + windows + web
#   workflow_dispatch                                 -> linux + windows + web
#
# linux is the only job that runs `ctest`, so it runs on every push that touches
# the foundation: one native build, and a broken test cannot sit on main. windows
# (MinGW cross-build) and web (Emscripten) are the expensive half of the matrix and
# stay on the version-bump path — the tradeoff issue #28 sanctions — decided by the
# `gate` job below, which skips them instead of queueing them. The gate diffs the
# push's own before..after range, so a bump counts wherever it sits in the push, and
# it falls back to running the matrix when that range cannot be resolved. The
# workflow file is in `paths` too, so a trigger edit is exercised by a run rather
# than assumed.
on:
  push:
    branches: [ main ]
    paths:
      - 'remake/foundation/**'
      - '.github/workflows/build-foundation.yml'
  workflow_dispatch:

jobs:
  # Cheap pre-flight for the two expensive jobs. It runs on the same trigger as
  # `linux`, in parallel with it, and adds one checkout of this repo.
  gate:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.version.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The full history, so `before`..`after` resolves for any push.
          fetch-depth: 0
      - name: Did this push change VERSION?
        id: version
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            matrix=true
          else
            before="${{ github.event.before }}"
            after="${{ github.event.after }}"
            zeros="0000000000000000000000000000000000000000"
            # An all-zero (or empty) `before` is a push with no base — a new or
            # force-pushed ref — and `git diff` fails for the same reason. Both fall
            # back to running the matrix: two extra runners are cheap, a silently
            # skipped cross-target build is the defect this gate exists to remove.
            if [ -z "$before" ] || [ "$before" = "$zeros" ] \
               || ! git diff --name-only "$before" "$after" > "$RUNNER_TEMP/changed"; then
              echo "no usable $before..$after range: running the matrix"
              matrix=true
            elif grep -qx remake/foundation/VERSION "$RUNNER_TEMP/changed"; then
              matrix=true
            else
              matrix=false
            fi
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL3's build dependencies
        # SDL's configure REFUSES to finish without an X11 or Wayland development
        # library ("SDL could not find X11 or Wayland development libraries"),
        # so the runner needs them before the source build below. This job had
        # only ever run twice, on version bumps, and failed both times for this
        # reason — which is what per-push CI was added to stop hiding (issue #28).
        # The list is SDL's own README-linux set, minus the backends this port
        # never asks for, so a configure warning cannot turn into a puzzle later.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev \
            libdecor-0-dev libdrm-dev libgbm-dev libegl1-mesa-dev \
            libgl1-mesa-dev libgles2-mesa-dev libvulkan-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev
      - name: Build SDL3 from source
        # Ubuntu 24.04 has no libsdl3-dev, and SDL publishes no Linux devel
        # binary, so CI builds it — which is also the documented fallback for a
        # developer whose distribution is behind.
        run: |
          git clone --depth 1 --branch release-3.4.16 https://github.com/libsdl-org/SDL.git
          cmake -S SDL -B sdl -GNinja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PWD/sdl-prefix" -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF
          cmake --build sdl
          cmake --install sdl
      - name: Fetch pinned deps
        run: remake/foundation/scripts/fetch_deps.sh
      - name: Configure and build
        run: |
          cmake -S remake/foundation -B build -GNinja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PWD/sdl-prefix"
          cmake --build build
      - name: Host tests
        # Issue #23: the suite runs here, not only on a developer's machine. The tests
        # that need the original game data detect its absence and skip themselves (the
        # rendered-frame checks exit 77, which CTest records as Skipped), so CI never
        # needs the copyrighted install; anything asset-dependent stays local/opt-in.
        run: ctest --test-dir build --output-on-failure

  windows:
    # The gate decides whether the cross-target builds are worth running; see the
    # cadence note at the top.
    needs: gate
    if: needs.gate.outputs.matrix == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64 ninja-build
      - name: Fetch pinned deps
        run: remake/foundation/scripts/fetch_deps.sh
      - name: Configure and build
        run: |
          cmake -S remake/foundation -B build -GNinja \
            -DCMAKE_TOOLCHAIN_FILE=remake/foundation/cmake/toolchains/mingw-w64-x86_64.cmake \
            -DSDL3_DIR="$PWD/remake/foundation/third_party/SDL3-mingw/x86_64-w64-mingw32/lib/cmake/SDL3"
          cmake --build build
      - name: Check the executable exists
        run: test -f build/foundation_demo.exe

  web:
    # The gate decides whether the cross-target builds are worth running; see the
    # cadence note at the top.
    needs: gate
    if: needs.gate.outputs.matrix == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          # The version verified locally during bring-up (emcc 6.0.10).
          version: 6.0.10
      - name: Fetch pinned deps
        run: remake/foundation/scripts/fetch_deps.sh
      - name: Configure and build
        run: |
          emcmake cmake -S remake/foundation -B build -GNinja
          cmake --build build
      - name: Check the web artifacts exist
        run: |
          test -f build/foundation_demo.html
          test -f build/foundation_demo.wasm
