name: Build foundation (Linux / Windows / Web)

# The point of the foundation is that one source tree builds for every target, so
# the matrix below covers all three rather than the one the runner happens to be.

# Cadence (issue #28):
#   push to main touching remake/foundation/**        -> linux
#   push to main whose last commit bumps
#   remake/foundation/VERSION                         -> linux + windows + web
#   workflow_dispatch                                 -> linux + windows + web
#
# linux is the only job that runs `ctest`, so it runs on every push that touches
# the foundation: one native build, and a broken test cannot sit on main. windows
# (MinGW cross-build) and web (Emscripten) are the expensive half of the matrix and
# stay on the version-bump path — the tradeoff issue #28 sanctions — enforced by the
# `if:` on those two jobs, which skips them instead of queueing them. That `if:`
# reads `github.event.head_commit.modified`, and that list describes only the last
# commit of a push: put the bump in the last commit, or dispatch by hand, when it
# rides along with other work. The workflow file is in `paths` too, so a trigger
# edit is exercised by a run rather than assumed.
on:
  push:
    branches: [ main ]
    paths:
      - 'remake/foundation/**'
      - '.github/workflows/build-foundation.yml'
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build SDL3 from source
        # Ubuntu 24.04 has no libsdl3-dev, and SDL publishes no Linux devel
        # binary, so CI builds it — which is also the documented fallback for a
        # developer whose distribution is behind.
        run: |
          git clone --depth 1 --branch release-3.4.16 https://github.com/libsdl-org/SDL.git
          cmake -S SDL -B sdl -GNinja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PWD/sdl-prefix" -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF
          cmake --build sdl
          cmake --install sdl
      - name: Fetch pinned deps
        run: remake/foundation/scripts/fetch_deps.sh
      - name: Configure and build
        run: |
          cmake -S remake/foundation -B build -GNinja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PWD/sdl-prefix"
          cmake --build build
      - name: Host tests
        # Issue #23: the suite runs here, not only on a developer's machine. The tests
        # that need the original game data detect its absence and skip themselves (the
        # rendered-frame checks exit 77, which CTest records as Skipped), so CI never
        # needs the copyrighted install; anything asset-dependent stays local/opt-in.
        run: ctest --test-dir build --output-on-failure

  windows:
    # Version bumps and manual dispatch only; see the cadence note at the top.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.modified, 'remake/foundation/VERSION')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64 ninja-build
      - name: Fetch pinned deps
        run: remake/foundation/scripts/fetch_deps.sh
      - name: Configure and build
        run: |
          cmake -S remake/foundation -B build -GNinja \
            -DCMAKE_TOOLCHAIN_FILE=remake/foundation/cmake/toolchains/mingw-w64-x86_64.cmake \
            -DSDL3_DIR="$PWD/remake/foundation/third_party/SDL3-mingw/x86_64-w64-mingw32/lib/cmake/SDL3"
          cmake --build build
      - name: Check the executable exists
        run: test -f build/foundation_demo.exe

  web:
    # Version bumps and manual dispatch only; see the cadence note at the top.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.modified, 'remake/foundation/VERSION')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          # The version verified locally during bring-up (emcc 6.0.10).
          version: 6.0.10
      - name: Fetch pinned deps
        run: remake/foundation/scripts/fetch_deps.sh
      - name: Configure and build
        run: |
          emcmake cmake -S remake/foundation -B build -GNinja
          cmake --build build
      - name: Check the web artifacts exist
        run: |
          test -f build/foundation_demo.html
          test -f build/foundation_demo.wasm
